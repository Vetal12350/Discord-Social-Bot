name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Import check (without Discord login)
        run: python -c 'import animation, media, bot, config, social_posts, webhook_repost'
